# PostgreSQL local para el backend de dropshipping (Fase 2).
# Proyecto Compose y contenedor PROPIOS: no toca el contenedor n8n existente.
# Escucha solo en 127.0.0.1:5433 (el 5432 del equipo ya lo usa otra instalación de PostgreSQL).
name: dropship-backend

services:
  postgres:
    image: postgres:17-alpine
    container_name: dropship-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dropship
      POSTGRES_USER: dropship
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - dropship_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dropship -d dropship']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dropship_pgdata:
